<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Grade 7–8 Mathematics Assessment (45-Min MYA)</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3f8;
    color: #222;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    position: relative;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
    color: #1e3a8a;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.name-box {
    margin-bottom: 25px;
}

.name-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.name-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.progress-bar-container {
    width: 100%;
    background-color: #e0e6ed;
    border-radius: 10px;
    height: 12px;
    margin-bottom: 15px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background-color: #2563eb;
    transition: width 0.3s ease;
}

.status-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    color: #555;
    margin-bottom: 15px;
    font-size: 14px;
}

.timer-badge {
    background: #1e293b;
    color: #f8fafc;
    padding: 6px 14px;
    border-radius: 20px;
    font-family: monospace;
    font-size: 15px;
}

.question {
    background: #f7f9fc;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 20px;
    border-left: 6px solid #2563eb;
}

.question-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.question-number {
    font-weight: bold;
    color: #2563eb;
    font-size: 16px;
}

.question-text {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.svg-container {
    text-align: center;
    margin: 15px 0;
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
}

.option {
    display: block;
    padding: 12px;
    margin: 8px 0;
    background: white;
    border: 1px solid #d5dbe3;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
}

.option:hover {
    background: #edf3ff;
}

.option input {
    margin-right: 10px;
}

button {
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
    font-weight: bold;
}

.primary-btn {
    background: #2563eb;
    color: white;
}

.primary-btn:hover {
    background: #1d4ed8;
}

.alert-toast {
    display: none;
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
    padding: 10px 15px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-weight: bold;
    text-align: center;
}

#result {
    display: none;
    text-align: center;
    margin-top: 10px;
    padding: 30px;
    background: #f0f7ff;
    border-radius: 15px;
}

.score {
    font-size: 32px;
    font-weight: bold;
    margin: 15px;
    color: #1e3a8a;
}

.level {
    font-size: 24px;
    font-weight: bold;
    margin: 15px;
    color: #2563eb;
}

.analysis {
    margin-top: 25px;
}

.analysis table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: white;
}

.analysis th,
.analysis td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

.analysis th {
    background: #f0f2f5;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Adaptive Grade 7–8 Mathematics Assessment</h1>

<div class="subtitle">
Middle Year Assessment (MYA) — 45-Minute CAT
</div>

<div id="alertToast" class="alert-toast"></div>

<!-- Start Section -->
<div id="startSection">
    <div class="name-box">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter your full name">
    </div>
    <button class="primary-btn" onclick="startTest()">Start 45-Minute Assessment (20 Questions)</button>
</div>

<!-- Test Section -->
<div id="quizSection" class="hidden">
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status-header">
        <span id="questionCount">Question 1 of 20</span>
        <span id="timerDisplay" class="timer-badge">⏱ 45:00</span>
    </div>

    <form id="adaptiveForm">
        <div class="question">
            <div class="question-meta">
                <span class="question-number" id="qNumber">Question 1</span>
            </div>
            <div class="question-text" id="qText"></div>

            <div id="diagramContainer" class="svg-container hidden"></div>

            <div id="optionsContainer"></div>
        </div>

        <button class="primary-btn" type="button" onclick="submitAnswer()">Next Question</button>
    </form>
</div>

<!-- Result Section -->
<div id="result">
    <h2>Middle Year Assessment Result</h2>

    <div id="studentResult"></div>

    <div class="score" id="scoreResult"></div>

    <div class="level" id="levelResult"></div>

    <div class="analysis">
        <h3>Adaptive Performance Summary</h3>
        <table>
            <tr>
                <th>Difficulty Level</th>
                <th>Attempted</th>
                <th>Correct</th>
                <th>Accuracy</th>
            </tr>
            <tr>
                <td>Easy</td>
                <td id="easyAttempted">0</td>
                <td id="easyCorrect">0</td>
                <td id="easyAcc">0%</td>
            </tr>
            <tr>
                <td>Medium</td>
                <td id="medAttempted">0</td>
                <td id="medCorrect">0</td>
                <td id="medAcc">0%</td>
            </tr>
            <tr>
                <td>Hard</td>
                <td id="hardAttempted">0</td>
                <td id="hardCorrect">0</td>
                <td id="hardAcc">0%</td>
            </tr>
        </table>
    </div>
</div>

</div>

<script>
function showAlert(message) {
    const toast = document.getElementById("alertToast");
    toast.innerText = message;
    toast.style.display = "block";
    setTimeout(() => {
        toast.style.display = "none";
    }, 3500);
}

function generateSVGGrid(points = [], lines = []) {
    let svg = `<svg width="260" height="260" viewBox="-130 -130 260 260" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<rect x="-130" y="-130" width="260" height="260" fill="#f8fafc"/>`;
    
    for (let i = -5; i <= 5; i++) {
        let pos = i * 20;
        let strokeColor = (i === 0) ? "#334155" : "#e2e8f0";
        let strokeWidth = (i === 0) ? "2" : "1";
        
        svg += `<line x1="${pos}" y1="-120" x2="${pos}" y2="120" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
        svg += `<line x1="-120" y1="${pos}" x2="120" y2="${pos}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
        
        if (i !== 0 && i >= -5 && i <= 5) {
            svg += `<text x="${pos}" y="12" font-size="9" fill="#64748b" text-anchor="middle">${i}</text>`;
            svg += `<text x="-10" y="${-pos + 3}" font-size="9" fill="#64748b" text-anchor="end">${i}</text>`;
        }
    }
    
    svg += `<path d="M 0 -125 L -4 -115 L 4 -115 Z" fill="#334155"/>`;
    svg += `<path d="M 125 0 L 115 -4 L 115 4 Z" fill="#334155"/>`;
    svg += `<text x="115" y="-8" font-size="11" font-weight="bold" fill="#334155">x</text>`;
    svg += `<text x="8" y="-115" font-size="11" font-weight="bold" fill="#334155">y</text>`;

    lines.forEach(l => {
        let x1 = l.x1 * 20;
        let y1 = -l.y1 * 20;
        let x2 = l.x2 * 20;
        let y2 = -l.y2 * 20;
        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${l.color || '#2563eb'}" stroke-width="2.5" />`;
    });

    points.forEach(p => {
        let cx = p.x * 20;
        let cy = -p.y * 20;
        svg += `<circle cx="${cx}" cy="${cy}" r="5" fill="${p.color || '#dc2626'}" />`;
        if (p.label) {
            svg += `<text x="${cx + 7}" y="${cy - 7}" font-size="12" font-weight="bold" fill="#0f172a">${p.label}</text>`;
        }
    });

    svg += `</svg>`;
    return svg;
}

// 60-Question Pool (20 per level)
const questionBank = {
    1: [ // Easy
        { id: "e1", text: "What are the coordinates of point A plotted on the grid below?", svg: generateSVGGrid([{x: 3, y: 2, label: "A"}]), options: ["(3, 2)", "(2, 3)", "(−3, 2)", "(3, −2)"], answer: "A" },
        { id: "e2", text: "In which quadrant does the point (−4, 3) lie?", options: ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"], answer: "B" },
        { id: "e3", text: "What are the coordinates of the origin on a Cartesian grid?", svg: generateSVGGrid([{x: 0, y: 0, label: "O"}]), options: ["(1, 1)", "(0, 1)", "(0, 0)", "(1, 0)"], answer: "C" },
        { id: "e4", text: "If a point lies on the x-axis, what must its y-coordinate be?", options: ["0", "1", "−1", "Any positive number"], answer: "A" },
        { id: "e5", text: "What are the coordinates of point B shown on the grid below?", svg: generateSVGGrid([{x: -3, y: -2, label: "B"}]), options: ["(3, 2)", "(−3, 2)", "(−3, −2)", "(−2, −3)"], answer: "C" },
        { id: "e6", text: "Which axis runs horizontally across the coordinate grid?", options: ["x-axis", "y-axis", "z-axis", "Origin axis"], answer: "A" },
        { id: "e7", text: "In the point (-4, 7), which coordinate represents the y-axis position?", options: ["-4", "7", "3", "-7"], answer: "B" },
        { id: "e8", text: "Which point lies in Quadrant IV?", options: ["(2, -3)", "(-2, 3)", "(-2, -3)", "(2, 3)"], answer: "A" },
        { id: "e9", text: "If a point lies on the y-axis, what is its x-coordinate?", options: ["1", "-1", "0", "Any positive number"], answer: "C" },
        { id: "e10", text: "In the ordered pair (x, y), which coordinate comes first?", options: ["y-coordinate", "x-coordinate", "Origin", "Slope"], answer: "B" },
        { id: "e11", text: "What is −8 + 13?", options: ["−21", "−5", "5", "21"], answer: "C" },
        { id: "e12", text: "Simplify: 3x + 5x.", options: ["8", "8x", "15x", "2x"], answer: "B" },
        { id: "e13", text: "Solve: x + 7 = 15.", options: ["7", "8", "9", "22"], answer: "B" },
        { id: "e14", text: "What is 25% of 80?", options: ["15", "20", "25", "30"], answer: "B" },
        { id: "e15", text: "Evaluate 3x when x = 4.", options: ["7", "12", "1", "14"], answer: "B" },
        { id: "e16", text: "Solve for y: 2y = 18.", options: ["7", "8", "9", "36"], answer: "C" },
        { id: "e17", text: "What is the distance between (0, 0) and (0, 7)?", options: ["0", "7", "14", "49"], answer: "B" },
        { id: "e18", text: "What is the value of 5 squared?", options: ["10", "15", "25", "20"], answer: "C" },
        { id: "e19", text: "Which quadrant has negative x and positive y values?", options: ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"], answer: "B" },
        { id: "e20", text: "Solve for a: a - 9 = 3.", options: ["6", "-6", "12", "27"], answer: "C" }
    ],
    2: [ // Medium
        { id: "m1", text: "Find the distance between Point A (−2, 3) and Point B (4, 3).", svg: generateSVGGrid([{x: -2, y: 3, label: "A"}, {x: 4, y: 3, label: "B"}], [{x1: -2, y1: 3, x2: 4, y2: 3, color: "#93c5fd"}]), options: ["2 units", "4 units", "6 units", "8 units"], answer: "C" },
        { id: "m2", text: "What is the gradient (slope) of the line passing through (0, 1) and (2, 5)?", options: ["1", "2", "3", "4"], answer: "B" },
        { id: "m3", text: "Which equation represents a straight line passing through the origin with slope 3?", options: ["y = x + 3", "y = 3x", "y = 3", "x = 3y"], answer: "B" },
        { id: "m4", text: "If point P(3, 4) is reflected across the x-axis, what are its new coordinates?", options: ["(−3, 4)", "(3, −4)", "(−3, −4)", "(4, 3)"], answer: "B" },
        { id: "m5", text: "What is the slope of the horizontal line shown on the grid below?", svg: generateSVGGrid([], [{x1: -5, y1: 2, x2: 5, y2: 2}]), options: ["0", "1", "2", "Undefined"], answer: "A" },
        { id: "m6", text: "What is the x-intercept of the line y = 2x − 4?", svg: generateSVGGrid([{x: 2, y: 0, label: "(2,0)"}], [{x1: -1, y1: -6, x2: 4, y2: 4}]), options: ["(−4, 0)", "(0, −4)", "(2, 0)", "(0, 2)"], answer: "C" },
        { id: "m7", text: "What is the y-intercept of the line y = -4x + 9?", options: ["-4", "9", "-9", "4"], answer: "B" },
        { id: "m8", text: "Reflect the point (-5, 3) over the y-axis.", options: ["(5, 3)", "(-5, -3)", "(5, -3)", "(3, -5)"], answer: "A" },
        { id: "m9", text: "What is the slope of a vertical line?", options: ["0", "1", "Undefined", "Infinity"], answer: "C" },
        { id: "m10", text: "Translate the point (2, 5) up 3 units and left 4 units.", options: ["(6, 8)", "(-2, 8)", "(5, 2)", "(-2, 2)"], answer: "B" },
        { id: "m11", text: "What is the HCF of 18 and 24?", options: ["3", "6", "9", "12"], answer: "B" },
        { id: "m12", text: "Expand: 3(x + 4).", options: ["3x + 4", "x + 12", "3x + 12", "7x"], answer: "C" },
        { id: "m13", text: "A rectangle has length 8 cm and width 5 cm. What is its area?", options: ["13 cm²", "26 cm²", "40 cm²", "80 cm²"], answer: "C" },
        { id: "m14", text: "Solve: 2x − 5 = 9.", options: ["2", "5", "7", "14"], answer: "C" },
        { id: "m15", text: "Solve for x: 3x - 5 = 16.", options: ["5", "6", "7", "8"], answer: "C" },
        { id: "m16", text: "If y = 3x + 2, what is y when x = -2?", options: ["-8", "-4", "4", "8"], answer: "B" },
        { id: "m17", text: "Solve for m: 4m + 8 = 2m + 16.", options: ["2", "4", "6", "8"], answer: "B" },
        { id: "m18", text: "Solve for x: 2(x - 3) = 10.", options: ["5", "8", "11", "13"], answer: "B" },
        { id: "m19", text: "Which point lies on the line y = 2x + 1?", options: ["(1, 2)", "(2, 5)", "(3, 6)", "(0, 0)"], answer: "B" },
        { id: "m20", text: "Reflect the point (-2, -6) over the x-axis.", options: ["(2, -6)", "(-2, 6)", "(2, 6)", "(-6, -2)"], answer: "B" }
    ],
    3: [ // Hard
        { id: "h1", text: "Identify the equation of the line shown on the grid below.", svg: generateSVGGrid([], [{x1: -3, y1: -4, x2: 3, y2: 2}]), options: ["y = x + 1", "y = x − 1", "y = 2x + 1", "y = x + 2"], answer: "B" },
        { id: "h2", text: "Find the midpoint of the line segment joining Point A (−4, 2) and Point B (2, 6).", options: ["(−1, 4)", "(1, 4)", "(−2, 8)", "(−3, 4)"], answer: "A" },
        { id: "h3", text: "What is the y-intercept of the line 2x + 3y = 12?", options: ["(0, 6)", "(0, 4)", "(6, 0)", "(4, 0)"], answer: "B" },
        { id: "h4", text: "Which point lies on the line y = 3x − 2?", options: ["(1, 2)", "(2, 4)", "(3, 5)", "(0, 2)"], answer: "B" },
        { id: "h5", text: "What is the slope of a line perpendicular to a line with slope 2?", options: ["2", "−2", "1/2", "−1/2"], answer: "D" },
        { id: "h6", text: "Calculate the distance between (1, 2) and (4, 6).", options: ["3 units", "4 units", "5 units", "7 units"], answer: "C" },
        { id: "h7", text: "What is the equation of a line with slope -2 passing through (3, 1)?", options: ["y = -2x + 7", "y = -2x + 5", "y = 2x - 7", "y = -2x + 1"], answer: "A" },
        { id: "h8", text: "What is the slope of a line parallel to 2x + 4y = 8?", options: ["2", "-2", "-1/2", "1/2"], answer: "C" },
        { id: "h9", text: "Find the equation of a line passing through (2, 5) and (4, 11).", options: ["y = 3x - 1", "y = 3x + 1", "y = 2x + 1", "y = 3x - 5"], answer: "A" },
        { id: "h10", text: "Convert 3x - 2y = 6 into slope-intercept form (y = mx + c).", options: ["y = (3/2)x - 3", "y = (3/2)x + 3", "y = -(3/2)x - 3", "y = 3x - 6"], answer: "A" },
        { id: "h11", text: "If a line passes through (1, k) and (4, 8) with a slope of 2, what is k?", options: ["1", "2", "4", "6"], answer: "B" },
        { id: "h12", text: "Find the y-intercept of a line perpendicular to y = 2x + 3 passing through (4, 1).", options: ["1", "3", "5", "-1"], answer: "B" },
        { id: "h13", text: "Which equation represents a line parallel to y = -5x + 2 passing through (0, -4)?", options: ["y = -5x - 4", "y = 5x - 4", "y = (1/5)x - 4", "y = -5x + 4"], answer: "A" },
        { id: "h14", text: "Factorise: 6x + 12.", options: ["6(x + 2)", "6(x + 12)", "12(x + 6)", "2(3x + 12)"], answer: "A" },
        { id: "h15", text: "If y = 3x + 2, what is y when x = 4?", options: ["10", "12", "14", "16"], answer: "C" },
        { id: "h16", text: "One angle in a right-angled triangle is 35°. What is the other acute angle?", options: ["45°", "55°", "65°", "75°"], answer: "B" },
        { id: "h17", text: "Solve for x: 3(x − 2) = 2x + 5.", options: ["1", "7", "11", "13"], answer: "C" },
        { id: "h18", text: "Solve for x: 2(3x - 4) = 4x + 6.", options: ["5", "7", "8", "10"], answer: "B" },
        { id: "h19", text: "Solve for x: 5x - 3(x + 2) = 14.", options: ["8", "10", "12", "14"], answer: "B" },
        { id: "h20", text: "Solve the system of equations for x: x + y = 10 and x - y = 4.", options: ["5", "6", "7", "8"], answer: "C" }
    ]
};

// Adaptive State
let studentName = "";
let currentLevel = 2; // Start Medium
let currentQuestionIndex = 0;
let totalQuestionsToAsk = 20;
let servedQuestions = [];
let currentQuestion = null;
let timerInterval = null;
let secondsRemaining = 45 * 60;

let stats = {
    1: { attempted: 0, correct: 0 },
    2: { attempted: 0, correct: 0 },
    3: { attempted: 0, correct: 0 }
};

function startTest() {
    studentName = document.getElementById("studentName").value.trim();
    if (!studentName) {
        showAlert("Please enter your name to start.");
        return;
    }

    document.getElementById("startSection").classList.add("hidden");
    document.getElementById("quizSection").classList.remove("hidden");

    startTimer();
    loadNextQuestion();
}

function startTimer() {
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();

        if (secondsRemaining <= 0) {
            clearInterval(timerInterval);
            showAlert("Time is up! Submitting your assessment.");
            finishTest();
        }
    }, 1000);
}

function updateTimerDisplay() {
    let mins = Math.floor(secondsRemaining / 60);
    let secs = secondsRemaining % 60;
    let formattedMins = mins < 10 ? "0" + mins : mins;
    let formattedSecs = secs < 10 ? "0" + secs : secs;
    document.getElementById("timerDisplay").innerText = `⏱ ${formattedMins}:${formattedSecs}`;
}

function loadNextQuestion() {
    if (currentQuestionIndex >= totalQuestionsToAsk) {
        clearInterval(timerInterval);
        finishTest();
        return;
    }

    currentQuestionIndex++;
    
    const progressPercent = ((currentQuestionIndex - 1) / totalQuestionsToAsk) * 100;
    document.getElementById("progressBar").style.width = progressPercent + "%";
    document.getElementById("questionCount").innerText = `Question ${currentQuestionIndex} of ${totalQuestionsToAsk}`;
    
    let pool = questionBank[currentLevel].filter(q => !servedQuestions.includes(q.id));
    
    if (pool.length === 0) {
        let altLevel = currentLevel === 3 ? 2 : (currentLevel === 1 ? 2 : 1);
        pool = questionBank[altLevel].filter(q => !servedQuestions.includes(q.id));
    }

    currentQuestion = pool[Math.floor(Math.random() * pool.length)];
    servedQuestions.push(currentQuestion.id);

    document.getElementById("qNumber").innerText = `Question ${currentQuestionIndex}`;
    document.getElementById("qText").innerText = currentQuestion.text;

    const diagContainer = document.getElementById("diagramContainer");
    if (currentQuestion.svg) {
        diagContainer.innerHTML = currentQuestion.svg;
        diagContainer.classList.remove("hidden");
    } else {
        diagContainer.innerHTML = "";
        diagContainer.classList.add("hidden");
    }

    const optionsContainer = document.getElementById("optionsContainer");
    optionsContainer.innerHTML = "";
    
    const optionLabels = ["A", "B", "C", "D"];
    currentQuestion.options.forEach((optText, idx) => {
        const letter = optionLabels[idx];
        const label = document.createElement("label");
        label.className = "option";
        label.innerHTML = `<input type="radio" name="opt" value="${letter}"> ${letter}. ${optText}`;
        optionsContainer.appendChild(label);
    });
}

function submitAnswer() {
    const selected = document.querySelector('input[name="opt"]:checked');
    if (!selected) {
        showAlert("Please select an answer before continuing.");
        return;
    }

    const isCorrect = (selected.value === currentQuestion.answer);
    
    stats[currentLevel].attempted++;
    if (isCorrect) {
        stats[currentLevel].correct++;
    }

    if (isCorrect) {
        if (currentLevel < 3) currentLevel++;
    } else {
        if (currentLevel > 1) currentLevel--;
    }

    loadNextQuestion();
}

function finishTest() {
    clearInterval(timerInterval);
    document.getElementById("quizSection").classList.add("hidden");
    document.getElementById("result").style.display = "block";

    const totalAttempted = stats[1].attempted + stats[2].attempted + stats[3].attempted;
    const totalCorrect = stats[1].correct + stats[2].correct + stats[3].correct;
    
    const weightedScore = (stats[1].correct * 1) + (stats[2].correct * 2) + (stats[3].correct * 3);
    const maxPossibleWeighted = (stats[1].attempted * 1) + (stats[2].attempted * 2) + (stats[3].attempted * 3);
    const performanceRatio = maxPossibleWeighted > 0 ? (weightedScore / maxPossibleWeighted) : 0;

    let placement = "";
    if (currentLevel === 3 && performanceRatio >= 0.7) {
        placement = "Extension (Above Grade Level)";
    } else if (currentLevel >= 2 && performanceRatio >= 0.6) {
        placement = "Secure (On Grade Level)";
    } else if (currentLevel === 2) {
        placement = "Developing (Approaching Grade Level)";
    } else {
        placement = "Foundation (Needs Support)";
    }

    document.getElementById("studentResult").innerHTML = `<strong>Student:</strong> ${studentName}`;
    document.getElementById("scoreResult").innerHTML = `${totalCorrect} / ${totalAttempted} Correct<br><span style="font-size:18px; color:#555;">Weighted Score: ${weightedScore} pts</span>`;
    document.getElementById("levelResult").innerText = `Placement Level: ${placement}`;

    renderRow("easy", 1);
    renderRow("med", 2);
    renderRow("hard", 3);
}

function renderRow(prefix, level) {
    const att = stats[level].attempted;
    const corr = stats[level].correct;
    const acc = att > 0 ? Math.round((corr / att) * 100) : 0;

    document.getElementById(`${prefix}Attempted`).innerText = att;
    document.getElementById(`${prefix}Correct`).innerText = corr;
    document.getElementById(`${prefix}Acc`).innerText = `${acc}%`;
}
</script>
